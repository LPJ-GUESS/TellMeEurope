Fire_C_emissions_table: 
  Unit: "Mg km-2 yr-1" # The unit of the Benchmark
  Id: "Fire C Emissions" # The ID used for tabular output
  Name: "Fire C Emissions" # Used in plotting
  Description: "Carbon fire emissions from GFED4" # Used in tabular output
  Layer: "Fire" # Layer/column in Fields to base the comparison on
  Data:   
    Datasets: ["FIRE"]  # Name of Dataset (name of subfolder in data source directory)
    File_name: ["GFED4_Cemiss_05deg"] # The name of the files to process, should be the same for data and sim. (If ICOS or FLUXNET use data name)
    Format: ["GUESS"]
    First_year: NULL # Set first and last year to limit the temporal span, set to null takes the whole timespan 
    Last_year: NULL
    year.aggregate.method: "none" # The method to aggregate time dimention 
    spatial.aggregate.method:
    Conversion_factor: NULL # Numeric() list() the factor needed for conversion of dataset, leave empty or NULL if not used
    Layer_to_convert: NULL # List holding the dataset names of the Fields to be converted
    Dataset_name: ["GFED4"] # Used in plotting and tabular output
    Dataset_longname: "Global Fire Emissions Database, Version 4, (GFEDv4)"
    Dataset_source: "Randerson, J.T., G.R. van der Werf, L. Giglio, G.J. Collatz, and P.S. Kasibhatla. 2018. Global Fire Emissions Database, Version 4, (GFEDv4). ORNL DAAC, Oak Ridge, Tennessee, USA. https://doi.org/10.3334/ORNLDAAC/1293"
    Dataset_description: "This data set provides global estimates of monthly burned area, monthly emissions and fractional contributions of different fire types, daily/3-hourly fields to scale the monthly emissions to higher temporal resolutions, and data for monthly biosphere fluxes. The data are at 0.25-degree latitude by 0.25-degree longitude spatial resolution and are available from July 1997 through 2014. Emissions data are available for carbon (C), dry matter (DM), carbon dioxide (CO2), carbon monoxide (CO), methane (CH4), hydrogen (H2), nitrous oxide (N2O), nitrogen oxides (NOx), non-methane hydrocarbons (NMHC), organic carbon (OC), black carbon (BC), particulate matter 2.5 microns (PM2.5), total particulate matter (TPM), and sulfur dioxide (SO2) among others. These data are yearly totals by region, globally, and by fire source for each region."
    ICOS_FLUXNET_Specific:
      UT.threshold: NULL
      partition.method: NULL
      day.night.method: NULL
      NEE.day.night: NULL
      rm.leap: NULL
      data.cleaning: NULL
      qc.threshold: NULL # ICOS & FLUXNET specific settings.
  Simulations:
    Simulation: ["european_applications"]
    File_name: ["cflux"]
    Format: ["GUESS"]
    First_year: 2011
    Last_year: 2019
    year.aggregate.method: "none"
    spatial.aggregate.method: 
    Conversion_factor: 
    Layer_to_convert: 
    aDGVM_Specific:
      adgvm.file.type: "Yearly"
      adgvm.fire: 1
      adgvm.climate: 0
    aDGVM2_Specific:
      adgvm2.scheme: 1
      adgvm2.daily: TRUE
  Plotting:
    Spatial_Difference:
      Difference_Limits: [-0.01, 0.01]
      Difference_Breaks: [-0.01, -0.0075, -0.005, -0.0025, 0, 0.0025, 0.005, 0.0075, 0.01]
      Percentage.difference_Limits: [-100, 100]
      Percentage.difference_Breaks: [-100, -80, -60, -40, -20, 0, 20, 40, 60, 80, 100]
      Values_Limits:
      Values_Breaks:
    Spatial_Scatter:
      Limits: [0, 0.01] # Plotting settings limits and breaks list input []
  Statistics:
    ME: F
    NME: F
    NMSE: T
    RMSE: T 
    NME_2: F
    NMSE_2: F
    NME_3: F
    NMSE_3: F
    r: F
    r2: T
    r2_eff: F

